<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign In - Academic Sloth</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            scrollbar-width: thin;
            scrollbar-color: #ec7f13 #221910;
        }

        body::-webkit-scrollbar {
            width: 8px;
        }

        body::-webkit-scrollbar-track {
            background: #221910;
        }

        body::-webkit-scrollbar-thumb {
            background-color: #ec7f13;
            border-radius: 20px;
            border: 3px solid #221910;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#ec7f13", "background-light": "#f8f7f6", "background-dark": "#221910", }, fontFamily: { "display": ["Lexend", "sans-serif"] }, }, },
        }
    </script>
</head>

<body class="font-display bg-background-dark m-0 p-0 overflow-x-hidden">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
        
        <!-- Background Image -->
        <div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: linear-gradient(rgba(34, 25, 16, 0.7), rgba(34, 25, 16, 0.9)), url('assets/images/background image 1.png');"></div>

        <!-- Form Container -->
        <div class="relative z-10 flex flex-col w-full max-w-[480px] p-8 md:p-12 rounded-3xl border border-white/10 bg-black/40 backdrop-blur-md shadow-2xl">
            
            <!-- Logo & Title -->
            <a href="index.html" class="flex flex-col items-center gap-4 text-white mb-8 group">
                <div class="animate-float">
                    <img src="assets/images/Academic Sloth logo.png" class="h-16 w-auto object-contain drop-shadow-[0_0_15px_rgba(236,127,19,0.4)] group-hover:scale-105 transition-transform duration-300" alt="Academic Sloth Logo" />
                </div>
                <h2 class="text-white text-2xl font-bold tracking-tight">Academic Sloth</h2>
            </a>

            <!-- Sign In Form -->
            <div class="flex flex-col gap-6">
                <div class="text-center">
                    <h1 class="text-white text-3xl font-bold mb-2">Welcome Back</h1>
                    <p class="text-white/70 text-base">Sign in to continue your research</p>
                </div>

                <form id="signinForm" class="flex flex-col gap-4 mt-2">
                    <div class="flex flex-col gap-2">
                        <label class="text-white text-sm font-medium" for="email">Email</label>
                        <input type="email" id="email" name="email" required
                            class="min-h-[44px] w-full rounded-lg border border-white/20 bg-white/5 px-4 text-white placeholder:text-white/50 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors"
                            placeholder="john@university.edu" />
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-white text-sm font-medium" for="password">Password</label>
                        <input type="password" id="password" name="password" required
                            class="min-h-[44px] w-full rounded-lg border border-white/20 bg-white/5 px-4 text-white placeholder:text-white/50 focus:border-primary focus:ring-1 focus:ring-primary/50 focus:outline-none transition-colors"
                            placeholder="••••••••" />
                    </div>

                    <div class="flex items-center justify-between mt-2">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="remember" name="remember"
                                class="h-4 w-4 rounded border-white/20 bg-white/5 text-primary focus:ring-primary" />
                            <label for="remember" class="text-white/80 text-sm">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="text-primary text-sm hover:underline transition-colors">Forgot password?</a>
                    </div>

                    <button type="submit"
                        class="flex min-h-[48px] w-full cursor-pointer items-center justify-center rounded-lg px-4 bg-primary text-background-dark text-base font-bold transition-all duration-300 hover:scale-[1.02] shadow-[0_0_15px_rgba(236,127,19,0.3)] hover:shadow-[0_0_25px_rgba(236,127,19,0.6)] mt-4">
                        <span class="truncate">Sign In</span>
                    </button>

                    <p class="text-center text-white/60 text-sm mt-2">
                        Don't have an account? <a href="signup.html"
                            class="text-primary hover:underline font-medium transition-colors">Sign Up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/auth.js';

        document.getElementById('signinForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                remember: document.getElementById('remember').checked
            };

            await auth.signin(formData);
        });
    </script>
</body>

</html>
