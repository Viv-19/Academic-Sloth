<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Verify Email - Academic Sloth</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#ec7f13", "background-light": "#f8f7f6", "background-dark": "#221910", }, fontFamily: { "display": ["Lexend", "sans-serif"] }, }, },
        }
    </script>
</head>

<body class="font-display">
    <div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <div class="px-4 md:px-10 lg:px-20 xl:px-40 flex flex-1 justify-center py-5">
                <div class="layout-content-container flex flex-col max-w-[520px] flex-1">

                    <!-- TopNavBar -->
                    <header class="flex items-center justify-between border-b border-white/10 px-4 md:px-10 py-3 mb-8">
                        <a href="landing_page.html" class="flex items-center gap-4 text-white">
                            <h2 class="text-white text-xl font-bold">Academic Sloth</h2>
                        </a>
                    </header>

                    <!-- Verify Form -->
                    <div class="flex flex-col gap-6 px-4 py-10">
                        <div class="text-center">
                            <h1 class="text-white text-3xl font-bold mb-2">Verify Your Email</h1>
                            <p class="text-white/70 text-base">We sent a 6-digit code to your email. Enter it below to activate your account.</p>
                        </div>

                        <form id="verifyForm" class="flex flex-col gap-4 mt-4">
                            <!-- We use a hidden field or URL param in a real app, but for simplicity we'll just ask for the email again to verify -->
                            <div class="flex flex-col gap-2">
                                <label class="text-white text-sm font-medium" for="email">Email Address</label>
                                <input type="email" id="email" required
                                    class="min-h-[44px] w-full rounded-lg border border-white/20 bg-white/5 px-4 text-white placeholder:text-white/50 focus:border-primary focus:outline-none transition-colors"
                                    placeholder="Confirm your email" />
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="text-white text-sm font-medium" for="otp">6-Digit Code</label>
                                <input type="text" id="otp" required maxlength="6"
                                    class="min-h-[44px] w-full rounded-lg border border-white/20 bg-white/5 px-4 text-white placeholder:text-white/50 focus:border-primary focus:outline-none transition-colors text-center text-2xl tracking-[0.5em]"
                                    placeholder="••••••" />
                            </div>

                            <button type="submit"
                                class="flex min-h-[44px] w-full cursor-pointer items-center justify-center rounded-lg px-4 bg-primary text-background-dark text-base font-bold transition-transform hover:scale-[1.02] shadow-md mt-4">
                                <span class="truncate">Verify Account</span>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/auth.js';

        // Auto-fill email if we saved it during signup
        const savedEmail = localStorage.getItem('pending_email');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
        }

        document.getElementById('verifyForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                email: document.getElementById('email').value,
                otp: document.getElementById('otp').value
            };

            await auth.verifyOtp(formData);
        });
    </script>
</body>
</html>
