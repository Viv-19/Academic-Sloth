<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>My Library - Academic Sloth</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            scrollbar-width: thin;
            scrollbar-color: #ec7f13 #221910;
        }

        body::-webkit-scrollbar {
            width: 8px;
        }

        body::-webkit-scrollbar-track {
            background: #221910;
        }

        body::-webkit-scrollbar-thumb {
            background-color: #ec7f13;
            border-radius: 20px;
            border: 3px solid #221910;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#ec7f13", "background-light": "#f8f7f6", "background-dark": "#221910", }, fontFamily: { "display": ["Lexend", "sans-serif"] }, }, },
        }
    </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-white">
    <div class="relative flex min-h-screen w-full overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-[280px] h-screen sticky top-0 flex flex-col bg-[#1c140d] border-r border-white/5 shrink-0 z-10 shadow-2xl">
            <!-- Logo Section -->
            <div class="flex items-center gap-4 p-6 border-b border-white/5">
                <div class="flex items-center justify-center">
                    <img src="assets/images/Academic Sloth logo.png" class="h-8 w-auto object-contain drop-shadow-md" alt="Academic Sloth Logo" />
                </div>
                <h2 class="text-white text-lg font-bold tracking-tight">Academic Sloth</h2>
            </div>

            <!-- Navigation items -->
            <nav class="flex flex-col gap-2 p-4 mt-4 flex-1">
                <a href="dashboard.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-white/60 hover:text-white font-medium transition-colors">
                    <span class="material-symbols-outlined text-[20px]">grid_view</span> Dashboard
                </a>
                <a href="library.html" class="flex items-center gap-4 px-4 py-3 rounded-lg bg-white/10 text-white font-medium transition-colors shadow-sm">
                    <span class="material-symbols-outlined text-[20px]">book</span> My Library
                </a>
                <a href="chat.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-white/60 hover:text-white font-medium transition-colors">
                    <span class="material-symbols-outlined text-[20px]">chat</span> Chat
                </a>
                <a href="settings.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-white/60 hover:text-white font-medium transition-colors">
                    <span class="material-symbols-outlined text-[20px]">settings</span> Settings
                </a>
            </nav>

            <!-- User Profile Bottom -->
            <div class="p-4 border-t border-white/5 bg-black/20">
                <div class="flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <div class="size-10 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold text-lg border border-primary/30 shadow-inner">
                            <span id="sidebar-initial">U</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-white text-sm font-bold truncate max-w-[120px]" id="sidebar-username">User</span>
                            <span class="text-white/50 text-xs">Researcher</span>
                        </div>
                    </div>
                    <button id="logout-btn" title="Logout" class="text-white/40 hover:text-red-400 transition-colors p-2 rounded-lg hover:bg-white/5">
                        <span class="material-symbols-outlined text-[20px]">logout</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-background-dark">
            <div class="px-6 md:px-12 lg:px-20 py-10 max-w-[1400px] w-full mx-auto">
                <div class="flex flex-col gap-10">

                    <!-- Library Content -->
                    <div class="flex flex-col gap-6 px-4 py-4">
                        <div class="flex items-center justify-between">
                            <h1 class="text-white text-3xl font-bold">My Library</h1>
                            <div class="flex gap-3">
                                <select id="sort-by"
                                    class="min-h-[40px] rounded-lg border border-white/20 bg-white/5 px-4 text-white text-sm focus:border-primary focus:outline-none">
                                    <option value="recent">Most Recent</option>
                                    <option value="title">Title (A-Z)</option>
                                    <option value="author">Author (A-Z)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Library Stats -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="flex flex-col gap-2 p-4 rounded-xl border border-white/10 bg-white/5">
                                <span class="material-symbols-outlined text-primary text-3xl">folder</span>
                                <p class="text-white/60 text-sm">Total Papers</p>
                                <p id="total-papers" class="text-white text-2xl font-bold">0</p>
                            </div>
                            <div class="flex flex-col gap-2 p-4 rounded-xl border border-white/10 bg-white/5">
                                <span class="material-symbols-outlined text-primary text-3xl">upload</span>
                                <p class="text-white/60 text-sm">Uploaded This Month</p>
                                <p id="monthly-uploads" class="text-white text-2xl font-bold">0</p>
                            </div>
                            <div class="flex flex-col gap-2 p-4 rounded-xl border border-white/10 bg-white/5">
                                <span class="material-symbols-outlined text-primary text-3xl">chat</span>
                                <p class="text-white/60 text-sm">Chat Sessions</p>
                                <p id="chat-sessions" class="text-white text-2xl font-bold">0</p>
                            </div>
                        </div>

                        <!-- Papers Grid -->
                        <div id="library-papers" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Papers will be loaded here by JS -->
                            <div class="flex flex-col gap-2 p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-colors cursor-pointer"
                                onclick="window.location.href='paper_review.html?id=1'">
                                <div class="flex items-start justify-between">
                                    <h3 class="text-white text-base font-semibold line-clamp-2 flex-1">Sample Paper:
                                        Deep Learning for NLP</h3>
                                    <button class="text-white/60 hover:text-white">
                                        <span class="material-symbols-outlined text-xl">more_vert</span>
                                    </button>
                                </div>
                                <p class="text-white/60 text-sm line-clamp-1">John Doe, Jane Smith</p>
                                <p class="text-white/50 text-xs mt-2">Added: Jan 15, 2024</p>
                                <div class="flex gap-2 mt-2">
                                    <span class="px-2 py-1 rounded text-xs bg-primary/20 text-primary">AI</span>
                                    <span class="px-2 py-1 rounded text-xs bg-primary/20 text-primary">NLP</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from './js/auth.js';
        import { library } from './js/library.js';

        // Check authentication
        if (!auth.isAuthenticated()) {
            window.location.href = 'signin.html';
        }

        // Load user info
        const userName = auth.getUser()?.name || 'User';
        document.getElementById('sidebar-username').textContent = userName;
        document.getElementById('sidebar-initial').textContent = userName.charAt(0).toUpperCase();

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.logout();
        });

        // Load library
        library.loadLibrary('library-papers');
        library.loadStats('total-papers', 'monthly-uploads', 'chat-sessions');

        // Sort functionality
        document.getElementById('sort-by').addEventListener('change', (e) => {
            library.sortLibrary(e.target.value, 'library-papers');
        });
    </script>
</body>

</html>
