<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Forgot Password - Academic Sloth</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#ec7f13", "background-light": "#f8f7f6", "background-dark": "#221910", }, fontFamily: { "display": ["Lexend", "sans-serif"] }, }, },
        }
    </script>
</head>

<body class="font-display">
    <div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <div class="px-4 md:px-10 lg:px-20 xl:px-40 flex flex-1 justify-center py-5">
                <div class="layout-content-container flex flex-col max-w-[520px] flex-1">

                    <header class="flex items-center justify-between border-b border-white/10 px-4 md:px-10 py-3 mb-8">
                        <a href="landing_page.html" class="flex items-center gap-4 text-white">
                            <h2 class="text-white text-xl font-bold">Academic Sloth</h2>
                        </a>
                    </header>

                    <div class="flex flex-col gap-6 px-4 py-10">
                        <div class="text-center">
                            <h1 class="text-white text-3xl font-bold mb-2">Forgot Password</h1>
                            <p class="text-white/70 text-base">Enter your email and we'll send you an OTP to reset your password.</p>
                        </div>

                        <form id="forgotForm" class="flex flex-col gap-4 mt-4">
                            <div class="flex flex-col gap-2">
                                <label class="text-white text-sm font-medium" for="email">Email Address</label>
                                <input type="email" id="email" required
                                    class="min-h-[44px] w-full rounded-lg border border-white/20 bg-white/5 px-4 text-white placeholder:text-white/50 focus:border-primary focus:outline-none transition-colors"
                                    placeholder="john@university.edu" />
                            </div>

                            <button type="submit"
                                class="flex min-h-[44px] w-full cursor-pointer items-center justify-center rounded-lg px-4 bg-primary text-background-dark text-base font-bold transition-transform hover:scale-[1.02] shadow-md mt-4">
                                <span class="truncate">Send Reset OTP</span>
                            </button>

                            <p class="text-center text-white/60 text-sm mt-2">
                                Remember your password? <a href="signin.html" class="text-primary hover:underline font-medium">Sign In</a>
                            </p>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/auth.js';

        document.getElementById('forgotForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            // Save email so reset-password.html can auto-fill it
            localStorage.setItem('reset_email', email);
            await auth.forgotPassword(email);
        });
    </script>
</body>
</html>
