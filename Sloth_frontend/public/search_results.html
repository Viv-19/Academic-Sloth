<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Search Results - Academic Sloth</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            scrollbar-width: thin;
            scrollbar-color: #ec7f13 #221910;
        }

        body::-webkit-scrollbar {
            width: 8px;
        }

        body::-webkit-scrollbar-track {
            background: #221910;
        }

        body::-webkit-scrollbar-thumb {
            background-color: #ec7f13;
            border-radius: 20px;
            border: 3px solid #221910;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#ec7f13", "background-light": "#f8f7f6", "background-dark": "#221910", }, fontFamily: { "display": ["Lexend", "sans-serif"] }, }, },
        }
    </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-white">
    <div class="relative flex min-h-screen w-full overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-[280px] h-screen sticky top-0 flex flex-col bg-[#1c140d] border-r border-white/5 shrink-0 z-10 shadow-2xl">
            <!-- Logo Section -->
            <div class="flex items-center gap-4 p-6 border-b border-white/5">
                <div class="flex items-center justify-center">
                    <img src="assets/images/Academic Sloth logo.png" class="h-8 w-auto object-contain drop-shadow-md" alt="Academic Sloth Logo" />
                </div>
                <h2 class="text-white text-lg font-bold tracking-tight">Academic Sloth</h2>
            </div>

            <!-- Navigation items -->
            <nav class="flex flex-col gap-2 p-4 mt-4 flex-1">
                <a href="dashboard.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-white/60 hover:text-white font-medium transition-colors">
                    <span class="material-symbols-outlined text-[20px]">grid_view</span> Dashboard
                </a>
                <a href="library.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-white/60 hover:text-white font-medium transition-colors">
                    <span class="material-symbols-outlined text-[20px]">book</span> My Library
                </a>
                <span class="flex items-center gap-4 px-4 py-3 rounded-lg text-white/20 cursor-default" title="Open a paper from My Library to start chatting">
                    <span class="material-symbols-outlined text-[20px]">chat</span> Chat
                </span>
                <span class="flex items-center gap-4 px-4 py-3 rounded-lg text-white/20 cursor-default" title="Coming soon">
                    <span class="material-symbols-outlined text-[20px]">settings</span> Settings
                </span>
            </nav>

            <!-- User Profile Bottom -->
            <div class="p-4 border-t border-white/5 bg-black/20">
                <div class="flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <div class="size-10 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold text-lg border border-primary/30 shadow-inner">
                            <span id="sidebar-initial">U</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-white text-sm font-bold truncate max-w-[120px]" id="sidebar-username">User</span>
                            <span class="text-white/50 text-xs">Researcher</span>
                        </div>
                    </div>
                    <button id="logout-btn" title="Logout" class="text-white/40 hover:text-red-400 transition-colors p-2 rounded-lg hover:bg-white/5">
                        <span class="material-symbols-outlined text-[20px]">logout</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-background-dark">
            <div class="px-6 md:px-12 lg:px-20 py-10 max-w-[1400px] w-full mx-auto">
                <div class="flex flex-col gap-10">

                    <!-- Search Bar -->
                    <div class="flex flex-col gap-4 px-4 mb-6">
                        <div class="flex gap-2">
                            <input type="text" id="search-input" placeholder="Search for papers, authors, topics..."
                                class="flex-1 min-h-[48px] rounded-lg border border-white/20 bg-white/5 px-4 text-white placeholder:text-white/50 focus:border-primary focus:outline-none transition-colors" />
                            <button id="search-btn"
                                class="flex items-center justify-center gap-2 h-[48px] px-6 rounded-lg bg-primary text-background-dark font-bold hover:scale-[1.02] transition-transform shadow-md">
                                <span class="material-symbols-outlined">search</span>
                            </button>
                        </div>
                    </div>

                    <!-- Results Section -->
                    <div class="flex flex-col gap-6 px-4 py-4">
                        <div class="flex items-center justify-between">
                            <h1 class="text-white text-2xl font-bold">Search Results</h1>
                            <p id="result-count" class="text-white/60 text-sm">Loading...</p>
                        </div>

                        <!-- Search Results List -->
                        <div id="search-results" class="flex flex-col gap-4">
                            <!-- Results will be dynamically loaded here by search.js -->
                        </div>

                        <!-- Load More Button -->
                        <button id="load-more"
                            class="flex items-center justify-center gap-2 h-[44px] px-6 rounded-lg bg-white/10 border border-white/20 text-white font-medium hover:bg-white/20 transition-colors self-center mt-4">
                            <span>Load More Results</span>
                            <span class="material-symbols-outlined">expand_more</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from './js/auth.js';
        import { search } from './js/search.js';
        import { arxiv } from './js/arxiv.js';

        // Check authentication
        if (!auth.isAuthenticated()) {
            window.location.href = 'signin.html';
        }

        // Load user info
        const userName = auth.getUser()?.name || 'User';
        document.getElementById('sidebar-username').textContent = userName;
        document.getElementById('sidebar-initial').textContent = userName.charAt(0).toUpperCase();

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.logout();
        });

        // Get search query
        const query = sessionStorage.getItem('searchQuery') || '';
        document.getElementById('search-input').value = query;

        // Perform search
        if (query) {
            search.performSearch(query, 'search-results', 'result-count');
        }

        // New search
        document.getElementById('search-btn').addEventListener('click', () => {
            const newQuery = document.getElementById('search-input').value;
            
            if (newQuery.trim()) {
                sessionStorage.setItem('searchQuery', newQuery);
                search.performSearch(newQuery, 'search-results', 'result-count');
            }
        });

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('search-btn').click();
            }
        });
    </script>
</body>

</html>
